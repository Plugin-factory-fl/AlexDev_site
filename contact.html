<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Alex Software Services — web and Chrome extension development.">
  <title>Contact | Alex Software Services</title>
  <script>
    (function () {
      var t = localStorage.getItem("alexdev-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <header class="site-header">
    <div class="container header-inner">
      <a href="./" class="logo">Alex<span>Dev</span></a>
      <div class="header-actions">
        <button type="button" class="theme-toggle" aria-label="Toggle light or dark mode" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true"></span>
          <span class="theme-toggle-label">Light</span>
        </button>
        <nav class="nav" aria-label="Main">
          <a href="./" data-nav="home">Home</a>
          <a href="portfolio.html" data-nav="portfolio">Portfolio</a>
          <a href="contact.html" data-nav="contact">Contact</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="contact-page">
    <div class="container contact-page-inner reveal">
      <h1 class="contact-headline">Email me now to get started</h1>
      <button type="button" class="btn btn-green btn-lg" data-email-modal>Click Here To Start</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Alex Software Services</p>
      <nav class="nav" aria-label="Footer">
        <a href="./">Home</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>

  <div id="email-modal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog">
      <button type="button" class="modal-close" data-close-modal aria-label="Close">×</button>
      <p class="modal-eyebrow">Let's build</p>
      <h2 id="modal-title" class="modal-title">Your email client is ready</h2>
      <p class="modal-desc">Copy my address below or paste it into your favorite mail app.</p>
      <div class="modal-email-row">
        <span class="modal-email">hello@alexsoftwareservices.com</span>
        <button type="button" class="btn btn-green modal-copy">Copy to clipboard</button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
  <script src="js/main.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
